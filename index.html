<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>야츄</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 한 화면 게임판. 위 = 판/남은 횟수, 가운데 = 왼쪽 고정칸 + 오른쪽 주사위 쟁반, 아래 = 버튼 3개 */
:root{
  color-scheme: dark;
  --felt:#11463a;
  --felt-deep:#0a2a23;
  --ivory:#f4ecd8;
  --ivory-dim:#b9c4b4;
  --ink:#1d1a16;
  --heart:#d6362e;
  --brass:#e0aa45;
  --line:rgba(244,236,216,.18);
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --d:min(15.5vw,9vh,72px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--felt-deep);color:var(--ivory);font-family:var(--body);font-size:15px;
  overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

.app{height:100%;max-width:480px;margin:0 auto;padding-inline:16px;padding-block:12px;display:flex;flex-direction:column;gap:10px}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{margin:0;font-family:var(--display);font-weight:400;font-size:38px;line-height:1;letter-spacing:.02em}
.top h1 small{font-family:var(--body);font-size:13px;color:var(--ivory-dim);margin-left:8px;letter-spacing:0}
.meter{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:12px;color:var(--ivory-dim)}
.lamps{display:flex;gap:6px}
.lamps i{width:22px;height:8px;border-radius:4px;background:var(--brass);transition:background .25s,opacity .25s}
.lamps i.off{background:var(--line)}

.board{flex:1;min-height:0;display:flex;gap:10px}
.keepwrap{flex:none;display:flex;flex-direction:column;gap:6px;align-items:center;padding:8px 8px 10px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid var(--line)}
.keepwrap b{font-family:var(--display);font-weight:400;font-size:14px;letter-spacing:.2em;color:var(--brass);padding-left:.2em}
.keepstack{position:relative;width:var(--d);flex:1}
.slots,#keep{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;justify-content:flex-start}
.slots span{width:var(--d);height:var(--d);border-radius:20%;border:1.5px dashed var(--line)}
.tray{flex:1;min-width:0;border-radius:18px;border:1px solid var(--line);
  background:radial-gradient(120% 90% at 50% 40%,var(--felt),var(--felt-deep));
  box-shadow:inset 0 0 40px rgba(0,0,0,.45);display:flex;flex-direction:column}
#tray{flex:1;display:flex;flex-wrap:wrap;gap:calc(var(--d)*.32);align-content:center;justify-content:center;padding:14px}
.sensor{align-self:center;margin:0 12px 12px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;color:var(--ivory-dim)}
.sensor.ask{background:var(--brass);color:var(--ink);border-color:var(--brass);font-size:14px;padding:10px 18px}
.sensor.on{color:var(--brass)}
.status{margin:0;padding:0 12px 8px;text-align:center;font-size:13.5px;color:var(--ivory-dim);min-height:2.9em;text-wrap:balance;word-break:keep-all}

.die{width:var(--d);height:var(--d);flex:none;border-radius:20%;background:var(--ivory);
  box-shadow:inset 0 calc(var(--d)*-.07) 0 rgba(0,0,0,.16),0 calc(var(--d)*.08) calc(var(--d)*.14) rgba(0,0,0,.5);
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:calc(var(--d)*.14);rotate:var(--r,0deg);transition:rotate .25s}
.die i{place-self:center;width:calc(var(--d)*.17);height:calc(var(--d)*.17);border-radius:50%;background:var(--ink);opacity:0}
.die[data-v="0"]{background:rgba(244,236,216,.16);box-shadow:none}
.die[data-v="1"] i:nth-child(5){opacity:1;background:var(--heart);width:calc(var(--d)*.26);height:calc(var(--d)*.26)}
.die[data-v="2"] i:is(:nth-child(1),:nth-child(9)),
.die[data-v="3"] i:is(:nth-child(1),:nth-child(5),:nth-child(9)),
.die[data-v="4"] i:is(:nth-child(1),:nth-child(3),:nth-child(7),:nth-child(9)),
.die[data-v="5"] i:is(:nth-child(1),:nth-child(3),:nth-child(5),:nth-child(7),:nth-child(9)),
.die[data-v="6"] i:is(:nth-child(1),:nth-child(3),:nth-child(4),:nth-child(6),:nth-child(7),:nth-child(9)){opacity:1}
#keep .die{rotate:0deg;box-shadow:0 0 0 3px var(--brass),0 4px 10px rgba(0,0,0,.5)}
.die.rattle{animation:rattle .28s linear infinite}
.die.land{animation:land .3s ease-out}
@keyframes rattle{
  0%{transform:translate(0,0) rotate(0)}
  20%{transform:translate(-7%,6%) rotate(-16deg)}
  40%{transform:translate(8%,-7%) rotate(13deg)}
  60%{transform:translate(-6%,-8%) rotate(-11deg)}
  80%{transform:translate(7%,7%) rotate(17deg)}
  100%{transform:translate(0,0) rotate(0)}
}
@keyframes land{0%{transform:scale(1.18)}60%{transform:scale(.95)}100%{transform:scale(1)}}

.actions{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:54px;border-radius:14px;font-family:var(--display);font-size:20px;letter-spacing:.04em;transition:transform .08s,opacity .2s}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.35;cursor:default}
.btn.roll{grid-column:1/-1;background:var(--brass);color:var(--ink);box-shadow:0 4px 0 #9c7325}
.btn.heart{background:var(--heart);color:var(--ivory);box-shadow:0 4px 0 #8f1f1a}
.btn.score{border:2px solid var(--ivory);color:var(--ivory)}
.btn.score.nudge{animation:nudge 1.1s ease-in-out infinite}
@keyframes nudge{50%{background:rgba(244,236,216,.2)}}

.toast{position:fixed;left:50%;bottom:calc(210px + env(safe-area-inset-bottom,0px));translate:-50% 0;max-width:calc(100% - 48px);
  background:var(--ink);color:var(--ivory);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5;text-align:center}
.toast.on{opacity:1}

.sheet{position:fixed;inset:0;z-index:10;background:var(--felt-deep);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-in{flex:1;min-height:0;width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
.sheet header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px}
.total{font-family:var(--display);font-size:34px;color:var(--brass);font-variant-numeric:tabular-nums;line-height:1}
.total small{font-family:var(--body);font-size:12px;color:var(--ivory-dim);margin-right:8px}
.close{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);font-size:20px}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.now{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ivory-dim)}
.now .die{--d:30px}
.grp{display:flex;flex-direction:column}
.grp h3{margin:0 0 4px;font-size:12px;font-weight:400;letter-spacing:.14em;color:var(--brass)}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);border-radius:8px;width:100%}
.row .nm{font-size:16px}
.row .rl{grid-column:1;font-size:12.5px;color:var(--ivory-dim)}
.row .pt{grid-column:2;grid-row:1/3;min-width:52px;text-align:center;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.row.done .pt{color:var(--brass)}
.row.done .nm{color:var(--ivory-dim)}
.row.open .pt{border:1.5px dashed var(--line);border-radius:10px;padding:4px 6px;color:var(--ivory)}
.row.open.zero .pt{color:var(--ivory-dim)}
.row.sel{background:rgba(224,170,69,.16)}
.row.sel .pt{border:1.5px solid var(--brass);color:var(--brass)}
.row.sum{border-bottom:0;color:var(--ivory-dim)}
.row.sum .pt{font-size:16px}
.howto{margin:0;padding:12px 14px 12px 30px;border:1px solid var(--line);border-radius:12px;font-size:13.5px;line-height:1.65;color:var(--ivory-dim)}
.howto b{color:var(--ivory);font-weight:400}
.foot{flex:none;padding:10px 16px 14px;border-top:1px solid var(--line);display:flex;gap:10px}
.foot .btn{flex:1;font-size:18px}
.foot .btn.ghost{flex:none;padding:0 16px;border:1.5px solid var(--line);font-family:var(--body);font-size:14px;letter-spacing:0}
@media (prefers-reduced-motion:reduce){.die.rattle,.die.land,.btn.score.nudge{animation:none}}
</style>

<div class="app">
  <div class="top">
    <h1>야츄<small id="round">1 / 12 판</small></h1>
    <div class="meter"><span id="left">남은 흔들기 3번</span><div class="lamps" id="lamps"><i></i><i></i><i></i></div></div>
  </div>

  <div class="board">
    <div class="keepwrap">
      <b>고정</b>
      <div class="keepstack">
        <div class="slots"><span></span><span></span><span></span><span></span><span></span></div>
        <div id="keep"></div>
      </div>
    </div>
    <div class="tray">
      <div id="tray"></div>
      <p class="status" id="status"></p>
      <button class="sensor" id="sensor"></button>
    </div>
  </div>

  <div class="actions">
    <button class="btn roll" id="btnRoll">흔들기</button>
    <button class="btn heart" id="btnHeart">야수의심장</button>
    <button class="btn score" id="btnScore">점수확인</button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-in">
    <header>
      <h2>야츄 점수판</h2>
      <div class="total"><small>총점</small><span id="total">0</span></div>
      <button class="close" id="btnClose" aria-label="닫기">✕</button>
    </header>
    <div class="scroll" id="scroll"></div>
    <div class="foot">
      <button class="btn ghost" id="btnNew">새 게임</button>
      <button class="btn roll" id="btnRecord" disabled>기록할 칸을 고르세요</button>
    </div>
  </div>
</div>

<script>
(function(){
  var sum=function(d){return d.reduce(function(a,b){return a+b},0)};
  var counts=function(d){var c=[0,0,0,0,0,0,0];d.forEach(function(v){c[v]++});return c};
  var num=function(n){return function(d){return d.filter(function(v){return v===n}).length*n}};
  var run=function(d,len){var u=counts(d),best=0,cur=0;for(var i=1;i<=6;i++){cur=u[i]?cur+1:0;if(cur>best)best=cur}return best>=len};
  var UPPER=[
    {id:'n1',name:'에이스',rule:'1이 나온 주사위의 합',fn:num(1)},
    {id:'n2',name:'듀스',rule:'2가 나온 주사위의 합',fn:num(2)},
    {id:'n3',name:'트레이',rule:'3이 나온 주사위의 합',fn:num(3)},
    {id:'n4',name:'포',rule:'4가 나온 주사위의 합',fn:num(4)},
    {id:'n5',name:'파이브',rule:'5가 나온 주사위의 합',fn:num(5)},
    {id:'n6',name:'식스',rule:'6이 나온 주사위의 합',fn:num(6)}
  ];
  var LOWER=[
    {id:'choice',name:'초이스',rule:'조건 없음 · 주사위 5개의 합',fn:sum},
    {id:'four',name:'포 오브 어 카인드',rule:'같은 눈 4개 이상 · 주사위 5개의 합',fn:function(d){return Math.max.apply(null,counts(d))>=4?sum(d):0}},
    {id:'full',name:'풀 하우스',rule:'같은 눈 3개 + 같은 눈 2개 · 주사위 5개의 합',fn:function(d){var c=counts(d);return c.indexOf(3)>0&&c.indexOf(2)>0?sum(d):0}},
    {id:'small',name:'스몰 스트레이트',rule:'이어지는 눈 4개 (예: 2-3-4-5) · 15점',fn:function(d){return run(d,4)?15:0}},
    {id:'large',name:'라지 스트레이트',rule:'이어지는 눈 5개 (예: 1-2-3-4-5) · 30점',fn:function(d){return run(d,5)?30:0}},
    {id:'yacht',name:'야츄',rule:'같은 눈 5개 · 50점',fn:function(d){return Math.max.apply(null,counts(d))===5?50:0}}
  ];
  var ALL=UPPER.concat(LOWER), BONUS_AT=63, BONUS=35, KEY='yachu-v1';

  var S={vals:[0,0,0,0,0],held:[],rollsLeft:3,scores:{}};
  try{var saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.vals&&saved.vals.length===5)S=saved}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

  var $=function(id){return document.getElementById(id)};
  var tray=$('tray'),keep=$('keep'),dice=[],rolling=false,rollTargets=[],rollStart=0,lastMotion=0,quietUntil=0,ticker=0,sensorOk=false,selected=null,newArmed=false;

  function makeDie(v){var b=document.createElement('button');b.className='die';b.dataset.v=v;b.innerHTML='<i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>';return b}
  for(var i=0;i<5;i++){(function(i){
    var el=makeDie(S.vals[i]);
    el.style.setProperty('--r',(Math.random()*24-12).toFixed(1)+'deg');
    el.addEventListener('click',function(){toggleHold(i)});
    dice.push(el);
  })(i)}

  function rolled(){return S.vals[0]>0}
  function doneCount(){return Object.keys(S.scores).length}
  function gameOver(){return doneCount()>=ALL.length}
  function upperSum(){return UPPER.reduce(function(a,c){return a+(S.scores[c.id]||0)},0)}
  function total(){var t=ALL.reduce(function(a,c){return a+(S.scores[c.id]||0)},0);return t+(upperSum()>=BONUS_AT?BONUS:0)}

  // 주사위가 쟁반 <-> 고정칸으로 옮겨갈 때 미끄러지듯 이동
  function place(){
    var before=dice.map(function(el){return el.isConnected?el.getBoundingClientRect():null});
    S.held.forEach(function(i){keep.appendChild(dice[i])});
    for(var i=0;i<5;i++)if(S.held.indexOf(i)<0)tray.appendChild(dice[i]);
    dice.forEach(function(el,i){
      var a=before[i];if(!a||!el.animate)return;
      var b=el.getBoundingClientRect(),dx=a.left-b.left,dy=a.top-b.top;
      if(Math.abs(dx)+Math.abs(dy)<2)return;
      el.animate([{transform:'translate('+dx+'px,'+dy+'px)'},{transform:'none'}],{duration:260,easing:'cubic-bezier(.2,.8,.2,1)'});
    });
  }

  function render(){
    dice.forEach(function(el,i){
      el.dataset.v=S.vals[i];
      el.setAttribute('aria-label',S.vals[i]?('주사위 '+S.vals[i]+(S.held.indexOf(i)>=0?' (고정됨)':'')):'아직 굴리지 않은 주사위');
    });
    var over=gameOver();
    $('round').textContent=over?'게임 끝':(doneCount()+1)+' / '+ALL.length+' 판';
    $('left').textContent='남은 흔들기 '+S.rollsLeft+'번';
    [].forEach.call($('lamps').children,function(l,i){l.classList.toggle('off',i>=S.rollsLeft)});
    $('btnRoll').disabled=rolling||over||S.rollsLeft===0;
    $('btnHeart').disabled=rolling||over||S.rollsLeft===0||S.held.length===0;
    $('btnScore').classList.toggle('nudge',!over&&rolled()&&S.rollsLeft===0);
    var msg;
    if(over)msg='게임이 끝났어요. 최종 '+total()+'점. 점수확인에서 새 게임을 시작하세요.';
    else if(rolling)msg='데굴데굴…';
    else if(!rolled())msg=sensorOk?'휴대폰을 흔들어 주사위를 굴리세요.':'휴대폰을 흔들거나 흔들기 버튼을 누르세요.';
    else if(S.rollsLeft>0)msg='남길 주사위를 눌러 고정하고 다시 흔드세요.';
    else msg='세 번 다 흔들었어요. 점수확인에서 기록할 칸을 고르세요.';
    $('status').textContent=msg;
  }

  var toastT=0;
  function toast(t){var el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('on')},1800)}

  function toggleHold(i){
    if(rolling)return;
    if(!rolled()){toast('먼저 주사위를 흔들어 주세요');return}
    var at=S.held.indexOf(i);
    if(at>=0)S.held.splice(at,1);else S.held.push(i);
    place();render();save();
  }

  function beginRoll(all,quiet){
    if(rolling||!$('sheet').hidden)return;
    if(gameOver()){if(!quiet)toast('게임이 끝났어요. 점수확인에서 새 게임을 시작하세요');return}
    if(S.rollsLeft===0){if(!quiet)toast('세 번 다 흔들었어요. 점수를 기록하세요');return}
    if(all)S.held=[];
    rollTargets=[0,1,2,3,4].filter(function(i){return S.held.indexOf(i)<0});
    if(!rollTargets.length){if(!quiet)toast('굴릴 주사위가 없어요. 고정을 풀거나 야수의심장을 누르세요');return}
    rolling=true;rollStart=Date.now();
    place();
    rollTargets.forEach(function(i){dice[i].classList.remove('land');dice[i].classList.add('rattle');dice[i].style.animationDelay=(-Math.random()*.28).toFixed(2)+'s'});
    render();
    ticker=setInterval(function(){
      rollTargets.forEach(function(i){dice[i].dataset.v=1+Math.floor(Math.random()*6)});
      var now=Date.now(),t=now-rollStart;
      // 흔드는 동안은 계속 구르고, 멈추면(또는 4초가 지나면) 눈이 정해진다
      if((t>650&&now-lastMotion>350)||t>4000)endRoll();
    },80);
  }

  function endRoll(){
    clearInterval(ticker);
    rollTargets.forEach(function(i){
      S.vals[i]=1+Math.floor(Math.random()*6);
      var el=dice[i];el.classList.remove('rattle');el.style.animationDelay='';
      el.style.setProperty('--r',(Math.random()*28-14).toFixed(1)+'deg');
      void el.offsetWidth;el.classList.add('land');
    });
    S.rollsLeft--;rolling=false;quietUntil=Date.now()+900;
    if(navigator.vibrate){try{navigator.vibrate(40)}catch(e){}}
    render();save();
  }

  // 흔들기 감지
  var hits=[],listening=false,denied=false;
  var needAsk=typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function';
  function sensorUI(){
    var el=$('sensor'),t,c='sensor';
    if(sensorOk){t='흔들기 센서 켜짐';c+=' on'}
    else if(typeof DeviceMotionEvent==='undefined'){t='이 기기는 흔들기 센서가 없어요 · 버튼으로 굴리세요'}
    else if(denied){t='센서가 거부됨 · 브라우저를 완전히 닫았다 다시 열어 허용하세요'}
    else if(needAsk&&!listening){t='여기를 눌러 흔들기 센서 허용';c+=' ask'}
    else{t='흔들기 센서 확인 중… 안 되면 버튼으로 굴리세요'}
    el.textContent=t;el.className=c;
  }
  function onMotion(e){
    var a=e.acceleration,g=e.accelerationIncludingGravity,strong=false,seen=false;
    if(a&&a.x!=null){seen=true;if(Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z)>8)strong=true}
    if(g&&g.x!=null){seen=true;if(Math.abs(Math.sqrt(g.x*g.x+g.y*g.y+g.z*g.z)-9.81)>5)strong=true}
    if(seen&&!sensorOk){sensorOk=true;sensorUI();if(!rolling)render()}
    if(!strong)return;
    var now=Date.now();
    if(rolling){lastMotion=now;return}
    if(now<quietUntil)return;
    hits=hits.filter(function(t){return now-t<700});hits.push(now);
    if(hits.length>=2){hits=[];lastMotion=now;beginRoll(false,true)}
  }
  function listen(){if(listening)return;listening=true;window.addEventListener('devicemotion',onMotion);sensorUI()}
  // 아이폰은 화면을 눌러야 흔들기 센서 허용 창이 뜬다
  function askSensor(){
    if(!needAsk||listening)return;
    DeviceMotionEvent.requestPermission().then(function(r){
      if(r==='granted'){denied=false;listen()}else{denied=true;sensorUI()}
    }).catch(function(){sensorUI()});
  }
  if(needAsk){document.addEventListener('click',askSensor)}else if(typeof DeviceMotionEvent!=='undefined'){listen()}
  sensorUI();

  $('btnRoll').addEventListener('click',function(){lastMotion=0;beginRoll(false)});
  $('btnHeart').addEventListener('click',function(){lastMotion=0;beginRoll(true)});

  // 점수판
  function rowHTML(c){
    var has=c.id in S.scores,can=!has&&rolled()&&!gameOver(),p=can?c.fn(S.vals):0;
    var cls='row '+(has?'done':'open')+(can&&p===0?' zero':'')+(selected===c.id?' sel':'');
    var pt=has?S.scores[c.id]:(can?p:'–');
    return '<button class="'+cls+'" data-id="'+c.id+'"'+(can?'':' disabled')+'><span class="nm">'+c.name+'</span><span class="rl">'+c.rule+'</span><span class="pt">'+pt+'</span></button>';
  }
  function renderSheet(){
    var up=upperSum(),over=gameOver(),h='';
    if(rolled()&&!over){
      h+='<div class="now"><span>지금 주사위</span>'+S.vals.map(function(v){return '<span class="die" data-v="'+v+'"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>'}).join('')+'</div>';
    }
    h+='<div class="grp"><h3>숫자 칸</h3>'+UPPER.map(rowHTML).join('')+
       '<div class="row sum"><span class="nm">숫자 칸 합계 '+up+' / '+BONUS_AT+'</span><span class="rl">'+BONUS_AT+'점 이상이면 보너스 +'+BONUS+'점</span><span class="pt">'+(up>=BONUS_AT?'+'+BONUS:'+0')+'</span></div></div>';
    h+='<div class="grp"><h3>조합 칸</h3>'+LOWER.map(rowHTML).join('')+'</div>';
    h+='<ol class="howto">'+
       '<li>한 판에 <b>최대 3번</b> 흔들 수 있어요.</li>'+
       '<li>흔든 뒤 남기고 싶은 주사위를 누르면 왼쪽 <b>고정</b> 칸으로 옮겨져요. 다시 누르면 풀려요.</li>'+
       '<li>다시 흔들면 고정하지 않은 주사위만 굴러요.</li>'+
       '<li><b>야수의심장</b>은 고정을 모두 풀고 5개를 한꺼번에 굴려요. 이것도 3번 중 1번을 써요.</li>'+
       '<li>판마다 빈 칸 하나에 점수를 꼭 기록해요. 조건이 안 맞으면 0점이에요.</li>'+
       '<li>12칸을 모두 채우면 끝. 총점이 높을수록 좋아요.</li></ol>';
    $('scroll').innerHTML=h;
    $('total').textContent=total();
    var rec=$('btnRecord'),c=ALL.filter(function(x){return x.id===selected})[0];
    if(over){rec.disabled=true;rec.textContent='최종 '+total()+'점'}
    else if(c){rec.disabled=false;rec.textContent=c.name+'에 '+c.fn(S.vals)+'점 기록'}
    else{rec.disabled=true;rec.textContent=rolled()?'기록할 칸을 고르세요':'먼저 주사위를 흔드세요'}
    $('btnNew').textContent=newArmed?'한 번 더 누르면 초기화':'새 게임';
  }
  function openSheet(){if(rolling)return;selected=null;newArmed=false;renderSheet();$('sheet').hidden=false;$('scroll').scrollTop=0}
  function closeSheet(){$('sheet').hidden=true;quietUntil=Date.now()+600}
  function nextRound(){S.vals=[0,0,0,0,0];S.held=[];S.rollsLeft=3;selected=null;place();render();save()}

  $('btnScore').addEventListener('click',openSheet);
  $('btnClose').addEventListener('click',closeSheet);
  $('scroll').addEventListener('click',function(e){
    var r=e.target.closest('.row[data-id]');if(!r||r.disabled)return;
    selected=selected===r.dataset.id?null:r.dataset.id;newArmed=false;
    var y=$('scroll').scrollTop;renderSheet();$('scroll').scrollTop=y;
  });
  $('btnRecord').addEventListener('click',function(){
    var c=ALL.filter(function(x){return x.id===selected})[0];if(!c||!rolled())return;
    S.scores[c.id]=c.fn(S.vals);
    nextRound();
    if(gameOver()){renderSheet();$('scroll').scrollTop=0}
    else{closeSheet();toast((doneCount()+1)+'번째 판 시작')}
  });
  $('btnNew').addEventListener('click',function(){
    if(!newArmed&&doneCount()>0&&!gameOver()){newArmed=true;renderSheet();return}
    S.scores={};newArmed=false;nextRound();closeSheet();toast('새 게임 시작');
  });

  place();render();
})();
</script>
