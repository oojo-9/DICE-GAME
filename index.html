<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>야츄</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15171c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="야츄">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap">
<style>
/* 판: 초록 펠트 대신 나무 주사위 쟁반. 주변 화면은 어두운 회색으로 물러나 있다 */
/* 레이아웃: 한 화면 게임판. 위 = 판/남은 횟수 + 차례, 가운데 = 왼쪽 고정칸 + 오른쪽 주사위 쟁반, 아래 = 버튼 3개 */
:root{
  color-scheme: dark;
  --felt:#23262e;
  --felt-deep:#15171c;
  --wood:#b58350;
  --wood-rim:#5f3d21;
  --ivory:#f4ecd8;
  --ivory-dim:#b4b7bf;
  --ink:#1d1a16;
  --heart:#d6362e;
  --brass:#e0aa45;
  --line:rgba(244,236,216,.18);
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --d:min(17vw,9.2vh,78px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--felt-deep);color:var(--ivory);font-family:var(--body);font-size:15px;
  overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible,.die:focus-visible,input:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

.app{height:100%;max-width:480px;margin:0 auto;padding-inline:16px;
  padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:10px}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{margin:0;font-family:var(--display);font-weight:400;font-size:32px;line-height:1;letter-spacing:.02em}
.top h1 small{font-family:var(--body);font-size:13px;color:var(--ivory-dim);margin-left:8px;letter-spacing:0}
.meter{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:12px;color:var(--ivory-dim)}
.lamps{display:flex;gap:6px}
.lamps i{width:22px;height:8px;border-radius:4px;background:var(--brass);transition:background .25s}
.lamps i.off{background:var(--line)}

.tools{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{min-width:0;height:38px;padding:0 6px;border-radius:9px;border:1px solid var(--line);font-size:12.5px;color:var(--ivory-dim);white-space:nowrap}
.mini.arm{background:var(--heart);border-color:var(--heart);color:var(--ivory)}
.turns{flex:none;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.turns::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:baseline;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;color:var(--ivory-dim);white-space:nowrap}
.chip b{font-family:var(--display);font-weight:400;font-size:14px;font-variant-numeric:tabular-nums}
.chip.cur{background:var(--brass);border-color:var(--brass);color:var(--ink)}
.chip.view{border-color:var(--ivory);color:var(--ivory)}

.avail{flex:none;height:42px;display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;font-size:12.5px;color:var(--ivory-dim)}
.avail::-webkit-scrollbar{display:none}
.avail button{flex:none;display:flex;align-items:baseline;gap:6px;height:36px;padding:0 12px;border-radius:10px;border:1.5px solid rgba(224,170,69,.7);font-size:13.5px;color:var(--ivory);white-space:nowrap}
.avail button b{font-family:var(--display);font-weight:400;font-size:17px;color:var(--brass);font-variant-numeric:tabular-nums}
.board{flex:1;min-height:0;display:flex;gap:10px}
.keepwrap{flex:none;display:flex;flex-direction:column;gap:6px;align-items:center;padding:8px 8px 10px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid var(--line)}
.keepwrap b{font-family:var(--display);font-weight:400;font-size:14px;letter-spacing:.2em;color:var(--brass);padding-left:.2em}
.keepstack{position:relative;width:var(--d);flex:1}
.slots,#keep{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;justify-content:flex-start}
.slots span{width:var(--d);height:var(--d);border-radius:18%;border:1.5px dashed var(--line)}
.tray{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
#tray{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:16px;border:6px solid var(--wood-rim);
  background:
    radial-gradient(110% 70% at 28% 18%,rgba(255,238,205,.30),transparent 62%),
    repeating-linear-gradient(93deg,rgba(70,40,15,.14) 0 1.5px,transparent 1.5px 7px),
    repeating-linear-gradient(87deg,rgba(255,225,175,.07) 0 3px,transparent 3px 21px),
    linear-gradient(180deg,var(--wood),#a17040);
  box-shadow:inset 0 10px 24px 2px rgba(0,0,0,.5),inset 0 -2px 6px rgba(255,230,190,.18),0 0 0 1px #3b2513,0 6px 14px rgba(0,0,0,.5)}
#tray.photo{background:var(--felt) center/cover no-repeat;border-color:#0d0f13;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 6px 14px rgba(0,0,0,.5)}
#tray.photo .die::after{background:rgba(0,0,0,.6)}
#tray .die{position:absolute;left:0;top:0;will-change:left,top}
.status{margin:0;padding:0 4px;text-align:center;font-size:13.5px;color:var(--ivory-dim);min-height:2.9em;text-wrap:balance;word-break:keep-all}
.status b{color:var(--brass);font-weight:400}
.sensor{align-self:center;margin:0;padding:7px 14px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;color:var(--ivory-dim)}
.sensor.ask{background:var(--brass);color:var(--ink);border-color:var(--brass);font-size:14px;padding:10px 18px}
.sensor.on{color:var(--brass)}

/* 주사위: 정육면체를 살짝 비스듬히 본 모양. 멈추면 정면(나온 눈)에만 눈이 보이고 옆면은 비워서 헷갈리지 않게 한다 */
.die{width:var(--d);height:var(--d);flex:none;position:relative;display:grid;place-items:center;cursor:pointer;
  perspective:calc(var(--d)*8);border-radius:18%;transition:opacity .2s}
.die::after{content:"";position:absolute;left:10%;right:2%;bottom:-4%;height:22%;border-radius:50%;background:rgba(40,20,5,.6);filter:blur(6px);z-index:-1}
.cube{--c:calc(var(--d)*.72);width:var(--c);height:var(--c);position:relative;transform-style:preserve-3d;transform:rotateX(-17deg) rotateY(-19deg)}
.face{position:absolute;inset:0;background:var(--ivory);border-radius:11%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);
  padding:calc(var(--c)*.13);box-shadow:inset 0 0 0 1px rgba(0,0,0,.16);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face i{place-self:center;width:calc(var(--c)*.17);height:calc(var(--c)*.17);border-radius:50%;background:var(--ink);opacity:0}
.cube .face[data-f="1"]{transform:translateZ(calc(var(--c)/2))}
.cube .face[data-f="6"]{transform:rotateY(180deg) translateZ(calc(var(--c)/2))}
.cube .face[data-f="3"]{transform:rotateY(90deg) translateZ(calc(var(--c)/2))}
.cube .face[data-f="4"]{transform:rotateY(-90deg) translateZ(calc(var(--c)/2))}
.cube .face[data-f="2"]{transform:rotateX(90deg) translateZ(calc(var(--c)/2))}
.cube .face[data-f="5"]{transform:rotateX(-90deg) translateZ(calc(var(--c)/2))}
.face[data-f="1"] i:nth-child(5){opacity:1;background:var(--heart);width:calc(var(--c)*.27);height:calc(var(--c)*.27)}
.face[data-f="2"] i:is(:nth-child(1),:nth-child(9)),
.face[data-f="3"] i:is(:nth-child(1),:nth-child(5),:nth-child(9)),
.face[data-f="4"] i:is(:nth-child(1),:nth-child(3),:nth-child(7),:nth-child(9)),
.face[data-f="5"] i:is(:nth-child(1),:nth-child(3),:nth-child(5),:nth-child(7),:nth-child(9)),
.face[data-f="6"] i:is(:nth-child(1),:nth-child(3),:nth-child(4),:nth-child(6),:nth-child(7),:nth-child(9)){opacity:1}
.face.side i{opacity:0!important}
.face.flat{--c:30px;position:relative;inset:auto;flex:none;width:var(--c);height:var(--c);border-radius:20%}
#keep .die{background:rgba(224,170,69,.2);box-shadow:0 0 0 2px var(--brass)}
#keep .die::after{display:none}
.actions{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:54px;border-radius:14px;font-family:var(--display);font-size:20px;letter-spacing:.04em;transition:transform .08s,opacity .2s}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.35;cursor:default}
.btn.roll{grid-column:1/-1;background:var(--brass);color:var(--ink);box-shadow:0 4px 0 #9c7325}
#btnRoll{--p:0%;background:linear-gradient(90deg,var(--heart) var(--p),var(--brass) var(--p));touch-action:none;-webkit-touch-callout:none;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
#btnRoll small{font-family:var(--body);font-size:11.5px;letter-spacing:0;opacity:.75}
.btn.heart{background:var(--heart);color:var(--ivory);box-shadow:0 4px 0 #8f1f1a}
.btn.score{border:2px solid var(--ivory);color:var(--ivory)}
.btn.score.nudge{animation:nudge 1.1s ease-in-out infinite}
@keyframes nudge{50%{background:rgba(244,236,216,.2)}}

.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));translate:-50% 0;box-shadow:0 4px 14px rgba(0,0,0,.5);border:1px solid var(--line);max-width:calc(100% - 48px);
  background:var(--ink);color:var(--ivory);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;text-align:center}
.toast.on{opacity:1}

.sheet,.setup{position:fixed;inset:0;z-index:10;background:var(--felt-deep);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-in{flex:1;min-height:0;width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
.sheet header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 10px}
.sheet h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px}
.close{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);font-size:20px}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:10px 16px 20px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line)}
.now{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ivory-dim)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;flex:none}
.card{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-variant-numeric:tabular-nums}
.card col.item{width:124px}
.card col.pl{width:62px}
.card th,.card td{height:42px;padding:0 6px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);text-align:center}
.card tr>:first-child{border-left:0;position:sticky;left:0;z-index:1;background:var(--felt-deep);text-align:left;padding-left:10px}
.card tr:last-child>*{border-bottom:0}
.card thead th{height:40px;font-weight:400;font-size:13.5px;color:var(--ivory-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:rgba(0,0,0,.28)}
.card thead th:first-child{background:#0d0f13}
.card thead th.cur{background:var(--brass);color:var(--ink)}
.card tbody th{font-weight:400;line-height:1.15}
.card .nm{display:block;font-size:14.5px;white-space:nowrap}
.card .rl{display:block;font-size:10.5px;color:var(--ivory-dim);white-space:nowrap}
.card td{font-family:var(--display);font-size:19px;color:var(--ivory)}
.card td.cur{background:rgba(224,170,69,.1)}
.card td small{font-family:var(--body);font-size:11px;color:var(--ivory-dim)}
.card td.open{padding:3px}
.card td.open button{width:100%;height:100%;border-radius:8px;border:1.5px dashed rgba(224,170,69,.7);font:inherit;color:var(--brass)}
.card td.open.zero button{color:var(--ivory-dim);border-color:var(--line)}
.card td.open.sel button{background:var(--brass);color:var(--ink);border-style:solid;border-color:var(--brass)}
.card tr.auto td{background-color:rgba(0,0,0,.28)}
.card tr.auto th:first-child{background:#0d0f13}
.card tr.sumrow td{color:var(--brass);font-size:21px}
.howto{margin:0;padding:12px 14px 12px 30px;border:1px solid var(--line);border-radius:12px;font-size:13.5px;line-height:1.65;color:var(--ivory-dim)}
.howto b{color:var(--ivory);font-weight:400}
.foot{flex:none;padding:10px 16px 14px;border-top:1px solid var(--line);display:flex;gap:10px}
.foot .btn{flex:1;font-size:18px}
.foot .btn.ghost{flex:none;padding:0 16px;border:1.5px solid var(--line);font-family:var(--body);font-size:14px;letter-spacing:0}

.setup{z-index:20;overflow-y:auto}
.setup-in{width:100%;max-width:420px;margin:auto;padding:28px 20px;display:flex;flex-direction:column;gap:18px}
.setup h1{margin:0;font-family:var(--display);font-weight:400;font-size:64px;line-height:1;text-align:center}
.setup .tag{margin:-8px 0 6px;text-align:center;color:var(--ivory-dim);font-size:14px}
.count{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:17px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--ivory);font-size:24px;line-height:1}
.stepper button:disabled{opacity:.3}
.stepper b{min-width:44px;text-align:center;font-family:var(--display);font-weight:400;font-size:30px;color:var(--brass)}
.names{display:flex;flex-direction:column;gap:8px}
.names label{display:flex;align-items:center;gap:10px}
.names span{flex:none;width:24px;text-align:center;font-family:var(--display);color:var(--brass);font-size:18px}
.names input{flex:1;min-width:0;height:48px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:rgba(0,0,0,.28);
  color:var(--ivory);font:inherit;font-size:16px;-webkit-user-select:text;user-select:text}
.names input::placeholder{color:rgba(185,196,180,.55)}
@media (prefers-reduced-motion:reduce){.btn.score.nudge{animation:none}}
</style>

<div class="app">
  <div class="top">
    <h1>야츄<small id="round"></small></h1>
    <div class="meter"><span id="left">남은 흔들기 3번</span><div class="lamps" id="lamps"><i></i><i></i><i></i></div></div>
  </div>
  <div class="turns" id="turns"></div>
  <div class="avail" id="avail" aria-label="지금 등록할 수 있는 항목"></div>

  <div class="board">
    <div class="keepwrap">
      <b>고정</b>
      <div class="keepstack">
        <div class="slots"><span></span><span></span><span></span><span></span><span></span></div>
        <div id="keep"></div>
      </div>
    </div>
    <div class="tray">
      <div id="tray"></div>
      <p class="status" id="status"></p>
      <button class="sensor" id="sensor"></button>
    </div>
  </div>

  <div class="actions">
    <button class="btn roll" id="btnRoll">흔들기<small>길게 누를수록 세게 굴러요</small></button>
    <button class="btn heart" id="btnHeart">야수의심장</button>
    <button class="btn score" id="btnScore">점수확인</button>
    <div class="tools">
      <button class="mini" id="btnPhoto">배경 찍기</button>
      <input id="photoInput" type="file" accept="image/*" capture="environment" hidden>
      <button class="mini" id="btnSave">임시저장</button>
      <button class="mini" id="btnReset">리셋</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-in">
    <header>
      <h2>야츄 점수판</h2>
      <button class="close" id="btnClose" aria-label="닫기">✕</button>
    </header>
    <div class="scroll" id="scroll"></div>
    <div class="foot">
      <button class="btn ghost" id="btnNew">새 게임</button>
      <button class="btn roll" id="btnRecord" disabled>기록할 칸을 고르세요</button>
    </div>
  </div>
</div>

<div class="setup" id="setup" hidden>
  <div class="setup-in">
    <h1>야츄</h1>
    <p class="tag">주사위 다섯 개, 흔들기 세 번</p>
    <div class="count">
      <span>몇 명이서 하나요?</span>
      <div class="stepper">
        <button id="btnMinus" aria-label="한 명 줄이기">−</button>
        <b id="pn">2</b>
        <button id="btnPlus" aria-label="한 명 늘리기">+</button>
      </div>
    </div>
    <div class="names" id="names"></div>
    <button class="btn roll" id="btnStart">게임 시작</button>
  </div>
</div>

<script>
(function(){
  var sum=function(d){return d.reduce(function(a,b){return a+b},0)};
  var counts=function(d){var c=[0,0,0,0,0,0,0];d.forEach(function(v){c[v]++});return c};
  var num=function(n){return function(d){return d.filter(function(v){return v===n}).length*n}};
  var run=function(d,len){var u=counts(d),best=0,cur=0;for(var i=1;i<=6;i++){cur=u[i]?cur+1:0;if(cur>best)best=cur}return best>=len};
  var UPPER=[
    {id:'n1',name:'에이스',rule:'1의 눈 합',fn:num(1)},
    {id:'n2',name:'듀얼',rule:'2의 눈 합',fn:num(2)},
    {id:'n3',name:'트리플',rule:'3의 눈 합',fn:num(3)},
    {id:'n4',name:'쿼드',rule:'4의 눈 합',fn:num(4)},
    {id:'n5',name:'펜타',rule:'5의 눈 합',fn:num(5)},
    {id:'n6',name:'헥사',rule:'6의 눈 합',fn:num(6)}
  ];
  var LOWER=[
    {id:'choice',name:'초이스',rule:'주사위 5개의 합',fn:sum},
    {id:'four',name:'포커',rule:'같은 눈 4개 · 5개의 합',fn:function(d){return Math.max.apply(null,counts(d))>=4?sum(d):0}},
    {id:'full',name:'풀하우스',rule:'3개+2개 · 5개의 합',fn:function(d){var c=counts(d);return c.indexOf(3)>0&&c.indexOf(2)>0?sum(d):0}},
    {id:'small',name:'스몰스트레이트',rule:'연속 4개 · 무조건 15점',fn:function(d){return run(d,4)?15:0}},
    {id:'large',name:'라지스트레이트',rule:'연속 5개 · 무조건 30점',fn:function(d){return run(d,5)?30:0}},
    {id:'yacht',name:'야츄',rule:'같은 눈 5개 · 무조건 50점',fn:function(d){return Math.max.apply(null,counts(d))===5?50:0}}
  ];
  var ALL=UPPER.concat(LOWER), BONUS_AT=63, BONUS=35, KEY='yachu-v2', MAXP=8;

  var S={started:false,players:[],turn:0,vals:[0,0,0,0,0],held:[],rollsLeft:3,setup:{n:2,names:[]}};
  try{var saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.vals&&saved.vals.length===5&&saved.players&&saved.setup)S=saved}catch(e){}
  if(!S.players.length)S.started=false;
  function fresh(){return {started:false,players:[],turn:0,vals:[0,0,0,0,0],held:[],rollsLeft:3,setup:{n:2,names:[]}}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){return false}}

  var $=function(id){return document.getElementById(id)};
  var esc=function(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};

  // 쟁반 안 주사위는 좌표(pos)로 놓인다. 굴릴 때는 이 좌표가 물리 계산으로 움직인다

    if(!strong)return;
    var now=Date.now();
    if(rolling){lastMotion=now;if(!holding&&now-lastKick>80){lastKick=now;kick(a&&a.x!=null?Math.min(30,Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z))*26:320)}return}
    if(now<quietUntil)return;
    hits=hits.filter(function(t){return now-t<700});hits.push(now);
    if(hits.length>=2){hits=[];lastMotion=now;if(beginRoll(true)){lastKick=now;kick(450)}}
  }
  function listen(){if(listening)return;listening=true;window.addEventListener('devicemotion',onMotion);sensorUI()}
  // 아이폰은 화면을 눌러야 흔들기 센서 허용 창이 뜬다
  function askSensor(){
    if(!needAsk||listening)return;
    DeviceMotionEvent.requestPermission().then(function(r){
      if(r==='granted'){denied=false;listen()}else{denied=true;sensorUI()}
    }).catch(function(){sensorUI()});
  }
  if(needAsk){document.addEventListener('click',askSensor)}else if(typeof DeviceMotionEvent!=='undefined'){listen()}
  sensorUI();

  $('btnRoll').addEventListener('pointerdown',function(e){
    if(e.button)return;
    lastMotion=0;holding=true;holdStart=Date.now();lastKick=0;
    if(!beginRoll(false))holding=false;
  });
  window.addEventListener('pointerup',release);
  window.addEventListener('pointercancel',release);
  window.addEventListener('blur',release);
  $('btnRoll').addEventListener('contextmenu',function(e){e.preventDefault()});
  $('btnRoll').addEventListener('keydown',function(e){
    if((e.key!=='Enter'&&e.key!==' ')||e.repeat)return;
    e.preventDefault();lastMotion=0;if(beginRoll(false))kick(800);
  });
  // 야수의심장: 고정한 주사위를 전부 판으로 되돌리기만 한다. 굴리는 건 흔들어야 한다
  $('btnHeart').addEventListener('click',function(){
    if(rolling||!S.held.length)return;
    S.held=[];place();render();save();
    toast('고정을 모두 풀었어요. 흔들어서 5개를 굴리세요');
  });

  // 점수판
  function renderSheet(){
    var over=gameOver(),can=!over&&rolled(),ps=S.players,h='',w=over?winners():null;
    var hi=function(i){return over?total(ps[i])===w.score:i===S.turn};
    if(can){
      h+='<div class="now"><span>'+esc(P().name)+'의 주사위</span>'+S.vals.map(function(v){return '<span class="face flat" data-f="'+v+'">'+PIPS+'</span>'}).join('')+'</div>';
    }
    var row=function(c){
      return '<tr><th><span class="nm">'+c.name+'</span><span class="rl">'+c.rule+'</span></th>'+ps.map(function(p,i){
        var cls=hi(i)?'cur':'';
        if(c.id in p.scores)return '<td class="'+cls+'">'+p.scores[c.id]+'</td>';
        if(can&&i===S.turn){var pv=c.fn(S.vals);return '<td class="open '+cls+(pv===0?' zero':'')+(selected===c.id?' sel':'')+'"><button data-id="'+c.id+'" aria-label="'+c.name+' '+pv+'점">'+pv+'</button></td>'}
        return '<td class="'+cls+'"></td>';
      }).join('')+'</tr>';
    };
    h+='<div class="tablewrap"><table class="card" style="min-width:'+(124+62*ps.length)+'px"><colgroup><col class="item">'+ps.map(function(){return '<col class="pl">'}).join('')+'</colgroup>';
    h+='<thead><tr><th>항목</th>'+ps.map(function(p,i){return '<th class="'+(hi(i)?'cur':'')+'">'+esc(p.name)+'</th>'}).join('')+'</tr></thead><tbody>';
    h+=UPPER.map(row).join('');
    // 보너스: 위 6칸 합이 63점 이상이 되는 순간 +35, 6칸을 다 채우고도 못 넘으면 0
    h+='<tr class="auto"><th><span class="nm">보너스</span><span class="rl">위 6칸 합 '+BONUS_AT+'점 이상 · 자동</span></th>'+ps.map(function(p,i){
      var up=upperSum(p),full=UPPER.every(function(c){return c.id in p.scores});
      return '<td class="'+(hi(i)?'cur':'')+'">'+(up>=BONUS_AT?'+'+BONUS:full?'0':'<small>'+up+'/'+BONUS_AT+'</small>')+'</td>';
    }).join('')+'</tr>';
    h+=LOWER.map(row).join('');
    // 총점: 그 사람의 12칸이 모두 채워졌을 때만 나온다
    h+='<tr class="auto sumrow"><th><span class="nm">총점</span><span class="rl">모든 칸을 채우면 공개</span></th>'+ps.map(function(p,i){
      return '<td class="'+(hi(i)?'cur':'')+'">'+(cnt(p)>=ALL.length?total(p):'')+'</td>';
    }).join('')+'</tr>';
    h+='</tbody></table></div>';
    h+='<ol class="howto">'+
       '<li>돌아가며 한 사람씩, 한 판에 <b>최대 3번</b> 흔들 수 있어요.</li>'+
       '<li>흔든 뒤 남기고 싶은 주사위를 누르면 왼쪽 <b>고정</b> 칸으로 옮겨져요. 다시 누르면 풀려요.</li>'+
       '<li>다시 흔들면 고정하지 않은 주사위만 굴러요.</li>'+
       '<li><b>야수의심장</b>은 고정한 주사위를 모두 판으로 되돌려요. 그다음 흔들면 5개가 다 굴러요.</li>'+
       '<li>자기 차례마다 자기 줄의 빈 칸 하나에 점수를 꼭 기록해요. 조건이 안 맞으면 0점이에요.</li>'+
       '<li>모두가 12칸을 채우면 끝. 총점이 가장 높은 사람이 이겨요.</li></ol>';
    $('scroll').innerHTML=h;
    var rec=$('btnRecord'),c=ALL.filter(function(x){return x.id===selected})[0];
    if(over){rec.disabled=true;rec.textContent='1등 '+w.names.join(', ')+' · '+w.score+'점'}
    else if(c&&can){rec.disabled=false;rec.textContent=c.name+'에 '+c.fn(S.vals)+'점 기록'}
    else{rec.disabled=true;rec.textContent=can?'기록할 칸을 고르세요':P().name+' · 먼저 주사위를 흔드세요'}
    $('btnNew').textContent=newArmed?'한 번 더 누르면 초기화':'새 게임';
  }
  function openSheet(){if(rolling||!S.started)return;selected=null;newArmed=false;renderSheet();$('sheet').hidden=false;$('scroll').scrollTop=0;var cur=$('scroll').querySelector('thead th.cur');if(cur&&cur.scrollIntoView)cur.scrollIntoView({block:'nearest',inline:'center'})}
  function closeSheet(){$('sheet').hidden=true;quietUntil=Date.now()+600}
  function resetDice(){S.vals=[0,0,0,0,0];S.held=[];S.rollsLeft=3;selected=null;layoutDefault();for(var i=0;i<5;i++)setFace(i,0)}

  // 임시저장: 지금 상태를 이 휴대폰에 저장. 리셋: 이름과 점수까지 전부 지우고 처음 화면으로
  $('btnSave').addEventListener('click',function(){
    if(rolling)return;
    toast(save()?'임시저장했어요. 다시 들어오면 이어서 할 수 있어요':'이 브라우저에서는 저장할 수 없어요');
  });
  // 배경 찍기: 카메라로 찍은 사진을 판 배경으로 쓴다. 어디에도 저장하지 않아서 창을 닫으면 사라진다
  var photoUrl=null;
  function setPhoto(url){
    if(photoUrl)URL.revokeObjectURL(photoUrl);
    photoUrl=url;
    tray.classList.toggle('photo',!!url);
    tray.style.backgroundImage=url?'url("'+url+'")':'';
    $('btnPhoto').textContent=url?'나무판':'배경 찍기';
  }
  $('btnPhoto').addEventListener('click',function(){
    if(rolling)return;
    if(photoUrl){setPhoto(null);return}
    $('photoInput').value='';$('photoInput').click();
  });
  $('photoInput').addEventListener('change',function(e){
    var f=e.target.files&&e.target.files[0];
    if(!f)return;
    if(!/^image\//.test(f.type)){toast('사진만 배경으로 쓸 수 있어요');return}
    setPhoto(URL.createObjectURL(f));
  });
  var resetArmed=false,resetT=0;
  function disarmReset(){resetArmed=false;clearTimeout(resetT);$('btnReset').textContent='리셋';$('btnReset').classList.remove('arm')}
  $('btnReset').addEventListener('click',function(){
    if(rolling)return;
    if(!resetArmed){
      resetArmed=true;$('btnReset').textContent='한 번 더 누르면 삭제';$('btnReset').classList.add('arm');
      resetT=setTimeout(disarmReset,3000);return;
    }
    disarmReset();
    try{localStorage.removeItem(KEY)}catch(e){}
    S=fresh();resetDice();place();showSetup();
  });
  $('btnScore').addEventListener('click',openSheet);
  $('avail').addEventListener('click',function(e){
    var b=e.target.closest('button[data-id]');if(!b||rolling)return;
    openSheet();selected=b.dataset.id;renderSheet();
  });
  $('btnClose').addEventListener('click',closeSheet);
  $('scroll').addEventListener('click',function(e){
    var r=e.target.closest('button[data-id]');if(!r)return;
    selected=selected===r.dataset.id?null:r.dataset.id;newArmed=false;
    var y=$('scroll').scrollTop,w=$('scroll').querySelector('.tablewrap'),x=w?w.scrollLeft:0;renderSheet();$('scroll').scrollTop=y;w=$('scroll').querySelector('.tablewrap');if(w)w.scrollLeft=x;
  });
  $('btnRecord').addEventListener('click',function(){
    var c=ALL.filter(function(x){return x.id===selected})[0];
    if(!c||!rolled()||gameOver())return;
    P().scores[c.id]=c.fn(S.vals);
    resetDice();
    if(!gameOver())S.turn=(S.turn+1)%S.players.length;
    place();render();save();
    if(gameOver()){renderSheet();$('scroll').scrollTop=0}
    else{closeSheet();toast(P().name+' 차례예요')}
  });
  $('btnNew').addEventListener('click',function(){
    var any=S.players.some(function(p){return cnt(p)>0});
    if(!newArmed&&any&&!gameOver()){newArmed=true;renderSheet();return}
    newArmed=false;S.started=false;save();closeSheet();showSetup();
  });

  // 처음 들어올 때: 인원과 닉네임
  function renderNames(){
    var n=S.setup.n,h='';
    for(var i=0;i<n;i++)h+='<label><span>'+(i+1)+'</span><input id="name'+i+'" type="text" maxlength="8" autocomplete="off" enterkeyhint="done" placeholder="플레이어 '+(i+1)+'" value="'+esc(S.setup.names[i]||'')+'"></label>';
    $('names').innerHTML=h;
    $('pn').textContent=n;
    $('btnMinus').disabled=n<=1;$('btnPlus').disabled=n>=MAXP;
  }
  function setCount(n){S.setup.n=Math.max(1,Math.min(MAXP,n));renderNames();save()}
  function showSetup(){renderNames();$('setup').hidden=false}
  $('btnMinus').addEventListener('click',function(){setCount(S.setup.n-1)});
  $('btnPlus').addEventListener('click',function(){setCount(S.setup.n+1)});
  $('names').addEventListener('input',function(e){
    var m=/^name(\d+)$/.exec(e.target.id||'');if(m){S.setup.names[+m[1]]=e.target.value;save()}
  });
  $('btnStart').addEventListener('click',function(){
    S.players=[];
    for(var i=0;i<S.setup.n;i++){
      var nm=(S.setup.names[i]||'').trim()||('플레이어 '+(i+1));
      S.players.push({name:nm,scores:{}});
    }
    S.turn=0;resetDice();S.started=true;
    $('setup').hidden=true;place();render();save();
    toast(P().name+' 차례예요');
  });

  layoutDefault();place();
  if(S.started)render();else showSetup();
})();
</script>
